name: resmi-gazete-manual-ingestion

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-atez}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-atezpassword}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./deploy/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: atez
      POSTGRES_PASSWORD: atezpassword
      POSTGRES_DB: atez_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atez -d atez_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-atez-local-access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-atez-local-secret-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]
    restart: unless-stopped

  backend:
    image: atez-mevzuat-backend:local
    build:
      context: ./backend
    command: ["sh", "-c", "npm run prisma:migrate && npm run start:api"]
    environment: &backend-environment
      AUTH_PROFILE: ${AUTH_PROFILE:-}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      SESSION_ENCRYPTION_KEY_ID: ${SESSION_ENCRYPTION_KEY_ID:-v1}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-1800}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-28800}
      AUTH_WORKSPACE_KEY: ${AUTH_WORKSPACE_KEY:-atez}
      OIDC_CA_FILE: ${OIDC_CA_FILE:-}
      AUTH_API_ALLOWED_HOSTS: ${AUTH_API_ALLOWED_HOSTS:-}
      WORKER_ACTOR_USER_ID: ${WORKER_ACTOR_USER_ID:-}
      MODULAR_OPERATIONS_ENABLED: ${MODULAR_OPERATIONS_ENABLED:-false}
      DATABASE_URL: postgresql://atez:atezpassword@db:5432/atez_db?schema=public
      PORT: "3001"
      RABBITMQ_URL: ${RABBITMQ_DOCKER_URL:-amqp://${RABBITMQ_USER:-atez}:${RABBITMQ_PASSWORD:-atezpassword}@rabbitmq:5672}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SENDER_ADDRESS: ${GRAPH_SENDER_ADDRESS:-}
      GRAPH_SENDER_NAME: ${GRAPH_SENDER_NAME:-ATEZ Mevzuat Radarı}
      SCAN_TIMEZONE: ${SCAN_TIMEZONE:-Europe/Istanbul}
      SOURCE_HOSTS: ${SOURCE_HOSTS:-resmigazete.gov.tr,www.resmigazete.gov.tr}
      SOURCE_DELAY_MS: ${SOURCE_DELAY_MS:-750}
      SOURCE_TIMEOUT_MS: ${SOURCE_TIMEOUT_MS:-30000}
      SOURCE_MAX_ATTEMPTS: ${SOURCE_MAX_ATTEMPTS:-3}
      NODE_EXTRA_CA_CERTS: /app/certs/GeoTrustTLSRSACAG1.pem
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
      MAX_RUN_BYTES: ${MAX_RUN_BYTES:-2147483648}
      S3_ENDPOINT: http://object-storage:9000
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_BUCKET: ${S3_BUCKET:-resmi-gazete}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-atez-local-access}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-atez-local-secret-change-me}
      S3_FORCE_PATH_STYLE: "true"
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TARIFF_ENABLED: ${TARIFF_ENABLED:-false}
      TARIFF_USERNAME: ${TARIFF_USERNAME:-}
      TARIFF_PASSWORD: ${TARIFF_PASSWORD:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-30000}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-3}
      GEMINI_MAX_CONTENT_BYTES: ${GEMINI_MAX_CONTENT_BYTES:-8000000}
      PREVIOUS_SOURCE_CONCURRENCY: ${PREVIOUS_SOURCE_CONCURRENCY:-3}
      TOPIC_ANALYSIS_CONCURRENCY: ${TOPIC_ANALYSIS_CONCURRENCY:-3}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      object-storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    image: atez-mevzuat-backend:local
    build:
      context: ./backend
    command: ["npm", "run", "start:worker"]
    environment: *backend-environment
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      object-storage:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8888:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  rabbitmqdata:

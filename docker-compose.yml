version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: atez
      POSTGRES_PASSWORD: atezpassword
      POSTGRES_DB: atez_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3333:3000"
    command:
      - "gotenberg"
    restart: unless-stopped

volumes:
  pgdata:

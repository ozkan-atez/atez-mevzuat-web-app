<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root { --ink:#1b2430; --muted:#5b6675; --line:#dfe3e8; --accent:#0b5cad; --bg:#ffffff; --soft:#f5f7fa; --up:#b42318; --down:#067647; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 20px 48px; }
  header { border-bottom: 2px solid var(--accent); padding-bottom: 16px; margin-bottom: 20px; }
  .card { display:inline-block; margin:0 0 8px; padding:2px 10px; border-radius:999px; background:var(--soft); color:var(--accent); font-size:12px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
  h1 { font-size: 24px; line-height:1.3; margin: 0 0 10px; }
  h2 { font-size: 16px; margin: 24px 0 8px; color: var(--accent); }
  .lead { font-size: 16px; margin: 0 0 12px; }
  .dates { display:flex; flex-wrap:wrap; gap: 8px 24px; margin:0; }
  .dates div { min-width: 140px; } .dates dt { font-size:12px; color:var(--muted); } .dates dd { margin:0; font-weight:600; }
  .points li { margin: 4px 0; }
  .callout { background:#fff8e6; border-left:3px solid #d99a00; padding:8px 12px; }
  .scroll { overflow-x:auto; }
  table { border-collapse: collapse; width:100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align:left; vertical-align:top; }
  th { background: var(--soft); font-weight:600; }
  td.n, th.n { text-align:right; white-space:nowrap; font-variant-numeric: tabular-nums; }
  td.mono { font-family: ui-monospace, Menlo, monospace; white-space:nowrap; }
  .note { font-size:13px; } .muted { color: var(--muted); }
  .sources ul { padding-left: 18px; } a { color: var(--accent); }
  footer { margin-top: 32px; font-size:12px; color: var(--muted); border-top:1px solid var(--line); padding-top: 8px; }
</style>
</head>
<body>
<main>
{{body}}
<footer>ATEZ Mevzuat Radarı · {{meta}}</footer>
</main>
</body>
</html>

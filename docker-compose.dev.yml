# İsteğe bağlı geliştirme katmanı: frontend'i bind-mount edilmiş kaynaktan Vite ile sunar (anlık
# yenileme) ve altyapı portlarını yalnızca 127.0.0.1'e açar.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Not: OIDC adresleri WEB_PORT'a bağlıdır; Vite de aynı host portundan (varsayılan 8890) sunulur.
services:
  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-35672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-35673}:15672"
  object-storage:
    ports:
      - "127.0.0.1:${MINIO_PORT:-39000}:9000"
      - "127.0.0.1:${MINIO_UI_PORT:-39001}:9001"
  backend:
    ports: ["127.0.0.1:${BACKEND_PORT:-3011}:3001"]
  v2-api:
    ports: ["127.0.0.1:${V2_API_PORT:-3110}:3100"]
  web:
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80 --strictPort"
    environment:
      VITE_DEV_CONTAINER: "true"
      VITE_API_PROXY_TARGET: http://backend:3001
      VITE_V2_API_PROXY_TARGET: http://v2-api:3100
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:

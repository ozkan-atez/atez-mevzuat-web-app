name: atez-web-auth-local
services:
  database:
    image: postgres@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Run local auth setup}
    volumes: [auth-database:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 3s
      timeout: 3s
      retries: 30
  realm-import:
    image: alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    user: '0:0'
    command: ['sh', '-ec', 'cp /source/realm.json /realm/atez-web-local.json; chown 1000:0 /realm/atez-web-local.json; chmod 600 /realm/atez-web-local.json']
    volumes:
      - ../../.local/auth/realm.json:/source/realm.json:ro
      - auth-realm:/realm
  keycloak:
    image: quay.io/keycloak/keycloak@sha256:242545583a811614bd671c3845c784c15b442652a31b7f305199bb550c1d4c07
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?}
      KC_HOSTNAME: http://localhost:45881
      KC_HEALTH_ENABLED: 'true'
    ports: ['127.0.0.1:45881:8080']
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      database: {condition: service_healthy}
      realm-import: {condition: service_completed_successfully}
    volumes: [auth-realm:/opt/keycloak/data/import:ro]
  backchannel:
    image: node:22-alpine
    command: ['node', '/app/backchannel.mjs']
    environment:
      AUTH_RELAY_KEY: ${AUTH_RELAY_KEY:?Local callback transport key required}
    ports: ['127.0.0.1:45882:8080']
    depends_on: {keycloak: {condition: service_started}}
    volumes:
      - ./backchannel.mjs:/app/backchannel.mjs:ro
      - ../../backend/node_modules/jose:/deps/jose:ro
      - auth-mailbox:/mailbox
volumes:
  auth-database:
  auth-realm:
  auth-mailbox:

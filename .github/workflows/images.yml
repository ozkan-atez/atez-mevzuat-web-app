# dev / test / main itişlerinde imajları GHCR'ye iter:
#   ghcr.io/<owner>/atez-mevzuat-{backend,v2,web}:{dal adı, sha-<kısa sha>}
# Ortamlar (test, üretim) docker-compose.prod.yml ile IMAGE_TAG=<dal> çeker.
name: Images

on:
  push:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {component: backend, image: backend}
          - {component: v2, image: v2}
          - {component: frontend, image: web}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/atez-mevzuat-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
